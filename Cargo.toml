[package]
name = "flare-core"
version = "1.1.1"
edition = "2024"
rust-version = "1.94.0"
description = "A high-performance, reliable long-connection communication toolkit for Rust, supporting WebSocket and QUIC protocols with features like authentication, device management, serialization negotiation, and protocol racing."
keywords = ["websocket", "quic", "tokio", "realtime", "instant-messaging"]
categories = ["network-programming", "asynchronous", "web-programming"]
authors = ["Flare Team"]
license = "Apache-2.0"
repository = "https://github.com/flare-im/flare-transport"
homepage = "https://github.com/flare-im/flare-transport"
documentation = "https://docs.rs/flare-core"
readme = "README.md"
exclude = [
    "target/",
    "Cargo.lock",
    "examples/",
    "scripts/",
    "docs/",
    "certs/",
    ".git/",
    ".github/",
    # 排除全部 md 再放回必要的几份：仓里有大量过程性文档，不该塞进发布包。
    # CHANGELOG 必须在包里 —— 用户在 docs.rs / crates.io 上看到的就是它，
    # 这次正是一个安全修复版本，变更记录比什么都重要。
    "*.md",
    "!README.md",
    "!README.zh-CN.md",
    "!CHANGELOG.md",
]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
bytes = "1"
async-trait = "0.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
flate2 = { version = "1.0", optional = true }
lazy_static = "1.4"
url = "2.5"
base64 = "0.22"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
base32 = "0.4"
aes-gcm = { version = "0.10", optional = true }
rand = "0.8"
anyhow = "1.0"

[build-dependencies]
prost-build = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# rustls-pemfile 已停止维护（RUSTSEC-2025-0134，无修复版本），
# PEM 解析改用其继任者 rustls-pki-types（rustls 的公共类型层，本就在依赖树里）。
rustls-pki-types = { version = "1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rcgen = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
x509-parser = "0.17"
webpki-roots = "0.26"
ulid = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time"] }
wasmtimer = "0.4"
web-time = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Blob",
    "console",
] }

[dev-dependencies]
# 属性测试：给处理不可信网络字节的解析路径做随机输入覆盖。
proptest = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# 虚拟时钟（`start_paused`）：重连退避这类用例不必真等几十秒。
tokio = { version = "1", features = ["test-util"] }

[features]
default = [
    "client",
    "server",
    "websocket",
    "quic",
    "compression-gzip",
    "encryption-aes-gcm",
]
full = [
    "client",
    "server",
    "websocket",
    "quic",
    "tcp",
    "compression-gzip",
    "encryption-aes-gcm",
]

# Public stack surfaces.
client = []
server = []

# Transport capabilities.
websocket = []
quic = []
tcp = []

# wasm32 客户端栈（WebSocket only）；构建时配合 --target wasm32-unknown-unknown
wasm = ["client", "websocket", "compression-gzip", "encryption-aes-gcm"]

# Codec / crypto capabilities.
compression-gzip = ["dep:flate2"]
encryption-aes-gcm = ["dep:aes-gcm"]

# 每个示例声明它用到的特性：关掉默认特性构建时（如 `--no-default-features --features server,quic`）
# 缺特性的示例被跳过，而不是编译失败。
[[example]]
name = "custom_extensions_example"
required-features = ["client", "server", "websocket"]

[[example]]
name = "flare_chat_client"
required-features = ["client", "websocket", "quic", "encryption-aes-gcm"]

[[example]]
name = "flare_chat_server"
required-features = ["server", "websocket", "quic", "compression-gzip", "encryption-aes-gcm"]

[[example]]
name = "loadconns"
required-features = ["client", "websocket"]

[[example]]
name = "observer_client"
required-features = ["client", "websocket", "quic"]

[[example]]
name = "observer_server"
required-features = ["server", "websocket", "quic"]

[[example]]
name = "quic_client"
required-features = ["client", "quic"]

[[example]]
name = "quic_probe"
required-features = ["client", "quic"]

[[example]]
name = "quic_server"
required-features = ["server", "quic"]

[[example]]
name = "simple_client"
required-features = ["client", "websocket"]

[[example]]
name = "simple_server"
required-features = ["server", "websocket"]

[[example]]
name = "tcp_client"
required-features = ["client", "tcp", "compression-gzip", "encryption-aes-gcm"]

[[example]]
name = "websocket_client"
required-features = ["client", "websocket"]

[[example]]
name = "websocket_server"
required-features = ["server", "websocket"]

[[bench]]
name = "perf_baseline"
harness = false
required-features = ["server", "compression-gzip"]
